<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 120" width="910" height="120" role="img" aria-labelledby="t d">
  <title id="t">Indexing</title>
  <desc id="d">Lecture notes are split into 75 chunks, embedded with BGE, and saved in a Chroma index.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; font-size: 14px; text-anchor: middle; }
    .title { font-weight: 600; font-size: 15px; }
    .edge { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  </style>

  <rect x="0.5" y="0.5" width="909" height="119" rx="12" fill="#161b22" stroke="#30363d"/>

  <rect x="30" y="30" width="170" height="60" rx="8" fill="#0d2d4a" stroke="#58a6ff" stroke-width="1.6"/>
  <text x="115" y="56" class="title">Lecture notes</text>
  <text x="115" y="75">Markdown</text>

  <rect x="250" y="30" width="170" height="60" rx="8" fill="#21262d" stroke="#6e7681" stroke-width="1.6"/>
  <text x="335" y="56" class="title">75 chunks</text>
  <text x="335" y="75">one per numbered unit</text>

  <rect x="470" y="30" width="170" height="60" rx="8" fill="#21262d" stroke="#6e7681" stroke-width="1.6"/>
  <text x="555" y="66" class="title">BGE embeddings</text>

  <path d="M690,40 v40 a85,10 0 0 0 170,0 v-40" fill="#0f2d1c" stroke="#3fb950" stroke-width="1.6"/>
  <ellipse cx="775" cy="40" rx="85" ry="10" fill="#0f2d1c" stroke="#3fb950" stroke-width="1.6"/>
  <text x="775" y="72" class="title">Chroma index</text>

  <line x1="200" y1="60" x2="248" y2="60" class="edge" marker-end="url(#arrow)"/>
  <line x1="420" y1="60" x2="468" y2="60" class="edge" marker-end="url(#arrow)"/>
  <line x1="640" y1="60" x2="688" y2="60" class="edge" marker-end="url(#arrow)"/>
</svg>
