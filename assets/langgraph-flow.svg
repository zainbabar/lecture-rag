<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="1000" height="390" role="img" aria-labelledby="t d">
  <title id="t">LangGraph graph</title>
  <desc id="d">The graph starts at retrieve, then check_evidence. A conditional edge goes to answer when the evidence is sufficient, to rewrite_query on the first insufficient pass, and to abstain after a rewrite. rewrite_query returns to retrieve. answer and abstain end the run.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e6edf3; font-size: 14px; text-anchor: middle; }
    .name { font-weight: 600; font-size: 15px; }
    .sub { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; }
    .label { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; }
    .edge { stroke: #8b949e; stroke-width: 1.6; fill: none; }
  </style>

  <rect x="0.5" y="0.5" width="999" height="389" rx="12" fill="#161b22" stroke="#30363d"/>

  <!-- START / END -->
  <rect x="24" y="172" width="72" height="36" rx="18" fill="#21262d" stroke="#6e7681" stroke-width="1.6"/>
  <text x="60" y="195" class="name">START</text>
  <rect x="910" y="172" width="72" height="36" rx="18" fill="#21262d" stroke="#6e7681" stroke-width="1.6"/>
  <text x="946" y="195" class="name">END</text>

  <!-- retrieve -->
  <rect x="130" y="155" width="160" height="70" rx="8" fill="#0d2d4a" stroke="#58a6ff" stroke-width="1.6"/>
  <text x="210" y="183" class="name">retrieve</text>
  <text x="210" y="205" class="sub">Chroma + BM25 + rerank</text>

  <!-- check_evidence -->
  <rect x="340" y="155" width="180" height="70" rx="8" fill="#3a2a0a" stroke="#d29922" stroke-width="1.6"/>
  <text x="430" y="183" class="name">check_evidence</text>
  <text x="430" y="205" class="sub">Qwen: is this enough?</text>

  <!-- answer -->
  <rect x="700" y="55" width="160" height="60" rx="8" fill="#0f2d1c" stroke="#3fb950" stroke-width="1.6"/>
  <text x="780" y="81" class="name">answer</text>
  <text x="780" y="101" class="sub">Qwen, cites chunk IDs</text>

  <!-- abstain -->
  <rect x="700" y="160" width="160" height="60" rx="8" fill="#21262d" stroke="#6e7681" stroke-width="1.6"/>
  <text x="780" y="186" class="name">abstain</text>
  <text x="780" y="206" class="sub">no model call</text>

  <!-- rewrite_query -->
  <rect x="340" y="290" width="180" height="60" rx="8" fill="#21262d" stroke="#6e7681" stroke-width="1.6"/>
  <text x="430" y="316" class="name">rewrite_query</text>
  <text x="430" y="336" class="sub">Qwen: new search query</text>

  <!-- edges -->
  <line x1="96" y1="190" x2="128" y2="190" class="edge" marker-end="url(#arrow)"/>
  <line x1="290" y1="190" x2="338" y2="190" class="edge" marker-end="url(#arrow)"/>
  <path d="M520,175 C610,175 610,85 698,85" class="edge" marker-end="url(#arrow)"/>
  <line x1="520" y1="190" x2="698" y2="190" class="edge" marker-end="url(#arrow)"/>
  <line x1="430" y1="225" x2="430" y2="288" class="edge" marker-end="url(#arrow)"/>
  <path d="M340,320 H210 V227" class="edge" marker-end="url(#arrow)"/>
  <path d="M860,85 H946 V170" class="edge" marker-end="url(#arrow)"/>
  <line x1="860" y1="190" x2="908" y2="190" class="edge" marker-end="url(#arrow)"/>

  <!-- edge labels -->
  <text x="640" y="68" class="label">sufficient</text>
  <text x="609" y="170" class="label">not sufficient,</text>
  <text x="609" y="184" class="label" style="font-size:11px">already rewrote</text>
  <text x="442" y="252" class="label" style="text-anchor:start">not sufficient,</text>
  <text x="442" y="266" class="label" style="text-anchor:start">first pass</text>
  <text x="275" y="312" class="label">new query</text>
</svg>
