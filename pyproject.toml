[project]
name = "lecture-rag"
version = "0.1.0"
description = "A retrieval-first study assistant over MATH 235 lecture notes."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "rank-bm25>=0.2.2,<0.3",
    "langchain-core>=1,<2",
    "langgraph>=1,<2",
    "sentence-transformers>=6.1.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
corpus = ["pymupdf>=1.26,<2"]

[tool.uv]
package = true
default-groups = ["dev", "corpus"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
